name: Offline acceptance

on:
  push:
    paths:
      - "*.py"
      - "baselines/**"
      - "benchmarks/**"
      - "ops/**"
      - "prompts/**"
      - "tests/**"
      - "viewer/**"
      - ".github/workflows/offline-acceptance.yml"
      - "!viewer/state.js"
  pull_request:
    paths:
      - "*.py"
      - "baselines/**"
      - "benchmarks/**"
      - "ops/**"
      - "prompts/**"
      - "tests/**"
      - "viewer/**"
      - ".github/workflows/offline-acceptance.yml"
      - "!viewer/state.js"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the existing Python runtime dependencies
        run: python -m pip install "pydantic==2.12.5" "requests==2.32.5"
      - name: Python offline suite
        run: python -m unittest discover -s tests/python -p "test_*.py"
      - name: Node viewer suite
        run: node --test tests/js/*.test.js
      - name: Historical contract coverage
        run: python tests/acceptance/check_contract_coverage.py
